<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peminjaman Alat</title>
    <link href="./src/output.css" rel="stylesheet">
</head>
<body class="h-screen flex flex-col overflow-hidden bg-gray-100">

    <header class="bg-gradient-to-r from-slate-900 to-teal-900 px-6 py-5 flex-none z-20 shadow-md">
        <div class="flex justify-between items-center w-full">
            <div>
                <h1 class="text-3xl font-bold text-yellow-200">Peminjaman</h1>
                <p class="text-sm text-white">Selamat datang di aplikasi peminjaman alat!</p>
            </div>
            <button id="tombolMenu" onclick="toggleMenu()" class="md:hidden text-white text-3xl leading-none px-2 hover:text-amber-200" aria-label="Buka menu navigasi">
                &#9776;
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <div id="sidebarLuar" onclick="toggleMenu()" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 md:hidden"></div>

        <aside id="sidebarMenu" class="hidden md:block fixed md:static inset-0 z-40 w-64 flex-none h-full bg-white border-r-2 border-slate-900 shadow-xl overflow-y-auto">
            <div class="flex items-center justify-between px-4 py-3 bg-slate-900 text-white font-bold md:hidden">
                <span>MENU NAVIGASI</span>
                <button onclick="toggleMenu()" class="text-2xl leading-none p-1">&times;</button>
            </div>
            <nav class="block">
                <a href="dashboard.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100">Dashboard</a>
                <a href="kategori.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100">Data Kategori</a>
                <a href="alat.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100">Data Alat</a>
                <a href="peminjaman.html" class="block px-4 py-3 border-b border-gray-300 hover:bg-blue-100 bg-blue-50 text-blue-600 font-semibold">Peminjaman</a>
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5">
                <h2 class="text-xl sm:text-2xl lg:text-3xl font-bold">Data Peminjaman</h2>
                <button onclick="bukaFormPeminjaman()" class="w-full sm:w-auto bg-slate-900 text-white px-4 py-2 rounded hover:bg-slate-600 text-sm sm:text-base font-medium">
                    + Buat Peminjaman
                </button>
            </div>

            <div class="bg-white border border-gray-300 rounded-lg p-3 sm:p-4 overflow-x-auto shadow-md">
                <table class="w-full border-collapse text-xs sm:text-sm">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="border p-2 text-center w-12">ID</th>
                            <th class="border p-2 text-left">Peminjaman</th>
                            <th class="border p-2 text-left">Kelas</th>
                            <th class="border p-2 text-left">Alat</th>
                            <th class="border p-2 text-center w-36">Tgl Pinjam</th>
                            <th class="border p-2 text-center w-36">Tgl Kembali</th>
                            <th class="border p-2 text-center w-28">Jumlah</th>
                            <th class="border p-2 text-center w-36">Status</th>
                            <th class="border p-2 text-center w-24">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="peminjaman-list" class="divide-y divide-gray-100">
                        <tr>
                            <td colspan="9" class="py-4 px-6 text-center text-gray-500">Memuat data peminjaman...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modalTambahPeminjaman" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 flex">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-5 sm:p-6 overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-900">Buat Peminjaman</h3>
                <button onclick="tutupModalPeminjaman()" type="button" class="text-slate-400 hover:text-slate-600 font-bold text-2xl">&times;</button>
            </div>
            <form id="formTambahPeminjaman" class="mt-4 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nama Peminjam</label>
                    <input type="text" id="tambah_nama_peminjam" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Kelas</label>
                    <input type="text" id="tambah_kelas" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Alat</label>
                    <select id="tambah_id_alat" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                        <option value="">-- Memuat Alat... --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Jumlah</label>
                    <input type="number" id="tambah_jumlah" min="1" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Tanggal Pinjam</label>
                    <input type="date" id="tambah_tanggal_pinjam" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button onclick="tutupModalPeminjaman()" type="button" class="px-4 py-2 border border-slate-300 rounded-lg text-sm hover:bg-gray-50">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-medium">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalEditPeminjaman" class="hidden fixed inset-0 z-50 items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 flex">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-5 sm:p-6 overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-900">Edit Peminjaman</h3>
                <button onclick="tutupModalEditPeminjaman()" type="button" class="text-slate-400 hover:text-slate-600 font-bold text-2xl">&times;</button>
            </div>
            <form id="formEditPeminjaman" class="mt-4 space-y-4">
                <input type="hidden" id="edit_id_peminjaman">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nama Peminjam</label>
                    <input type="text" id="edit_nama_peminjam" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Kelas</label>
                    <input type="text" id="edit_kelas" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Alat</label>
                    <select id="edit_id_alat" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                        <option value="">-- Memuat Alat... --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Jumlah</label>
                    <input type="number" id="edit_jumlah" min="1" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Tanggal Pinjam</label>
                    <input type="date" id="edit_tanggal_pinjam" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Status</label>
                    <select id="edit_status" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                        <option value="Dipinjam">Dipinjam</option>
                        <option value="Dikembalikan">Dikembalikan</option>
                    </select>
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button onclick="tutupModalEditPeminjaman()" type="button" class="px-4 py-2 border border-slate-300 rounded-lg text-sm hover:bg-gray-50">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">Update</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
